<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSIR Forum</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; color: #1b2a41; background: #f7f8fa; }
    h1 { color: #1b2a41; }
    h2 { margin-top: 28px; border-bottom: 2px solid #c9a227; padding-bottom: 4px; }
    form { display: flex; flex-direction: column; gap: 8px; background: white; padding: 16px; border-radius: 8px; }
    input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #1b2a41; color: white; border: none; cursor: pointer; }
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    .msg { color: #b00020; min-height: 20px; }
  </style>
</head>
<body>
  <h1>PSIR Forum</h1>
  <p id="status">Loading...</p>

  <div id="auth-section">
    <h2>Sign up</h2>
    <form id="signup-form">
      <input id="signup-name" placeholder="Full name" required>
      <input id="signup-email" type="email" placeholder="Email" required>
      <input id="signup-password" type="password" placeholder="Password (min 6 characters)" required minlength="6">
      <button type="submit">Create account</button>
    </form>

    <h2>Log in</h2>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email" required>
      <input id="login-password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>

  <div id="forum-section" style="display:none">
    <button id="logout-btn">Log out</button>
    <h2>Discussion categories</h2>
    <div id="categories"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://updxillknwufqekfzkur.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ctcI-xHdTj4TDIS9wC8n-Q_waZAg4F5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const msg = document.getElementById('msg');
    const status = document.getElementById('status');

    async function showForum(user) {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('forum-section').style.display = 'block';
      status.textContent = 'Signed in as ' + user.email;

      const { data, error } = await db.from('categories').select('*').order('id');
      const box = document.getElementById('categories');
      if (error) { box.textContent = 'Could not load categories: ' + error.message; return; }
      box.innerHTML = '';
      data.forEach(c => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = '<strong></strong><br><small></small>';
        div.querySelector('strong').textContent = c.name;
        div.querySelector('small').textContent = c.description || '';
        box.appendChild(div);
      });
    }

    function showAuth() {
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('forum-section').style.display = 'none';
      status.textContent = 'Welcome. Sign up or log in to join the discussion.';
    }

    document.getElementById('signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = 'Creating account...';
      const { error } = await db.auth.signUp({
        email: document.getElementById('signup-email').value,
        password: document.getElementById('signup-password').value,
        options: { data: { full_name: document.getElementById('signup-name').value } }
      });
      msg.textContent = error ? error.message : 'Account created. Check your email to confirm, then log in.';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = 'Logging in...';
      const { data, error } = await db.auth.signInWithPassword({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      });
      if (error) { msg.textContent = error.message; return; }
      msg.textContent = '';
      showForum(data.user);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      showAuth();
    });

    db.auth.getSession().then(({ data }) => {
      if (data.session) showForum(data.session.user);
      else showAuth();
    });
  </script>
</body>
</html>
