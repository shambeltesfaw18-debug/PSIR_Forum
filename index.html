<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSIR Forum</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; color: #1b2a41; background: #f7f8fa; }
    h1 { color: #1b2a41; }
    h2 { margin-top: 28px; border-bottom: 2px solid #c9a227; padding-bottom: 4px; }
    h3 { margin-top: 24px; color: #1b2a41; }
    form { display: flex; flex-direction: column; gap: 8px; background: white; padding: 16px; border-radius: 8px; }
    input, textarea, button { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; }
    button { background: #1b2a41; color: white; border: none; cursor: pointer; margin: 4px 4px 4px 0; }
    button.secondary { background: #e5e7eb; color: #1b2a41; }
    button.danger { background: #b00020; }
    button:disabled { opacity: .5; }
    .back { background: none; color: #1b2a41; padding: 4px 0; text-decoration: underline; }
    .card { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .card small, .meta { color: #666; font-size: 13px; }
    .row { background: white; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; margin-left: 4px; }
    .tag.speaker { background: #c8f7d4; }
    .tag.hand { background: #fff3c4; }
    .post { background: white; padding: 12px; border-radius: 8px; margin-bottom: 8px; white-space: pre-wrap; }
    .note { background: #fff8e1; padding: 12px; border-radius: 8px; color: #6b5300; }
    .msg { color: #b00020; min-height: 20px; }
  </style>
</head>
<body>
  <h1>PSIR Forum</h1>
  <p id="status">Loading...</p>

  <div id="auth-section">
    <h2>Sign up</h2>
    <form id="signup-form">
      <input id="signup-name" placeholder="Full name" required>
      <input id="signup-email" type="email" placeholder="Email" required>
      <input id="signup-password" type="password" placeholder="Password (min 6 characters)" required minlength="6">
      <button type="submit">Create account</button>
    </form>

    <h2>Log in</h2>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email" required>
      <input id="login-password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>

  <div id="forum-section" style="display:none">
    <button id="logout-btn" class="secondary">Log out</button>

    <!-- Screen 1: categories -->
    <div id="list-view">
      <h2>Discussion categories</h2>
      <div id="categories"></div>
    </div>

    <!-- Screen 2: one category, with audio room and threads -->
    <div id="category-view" style="display:none">
      <button class="back" id="back-categories">← All categories</button>
      <h2 id="cat-title"></h2>
      <p id="cat-desc"></p>

      <h3>Live audio room</h3>
      <p class="meta" id="room-desc">Join to listen. Speakers are invited by a host.</p>
      <div>
        <button id="join-room">Join room</button>
        <button id="mic-btn" class="secondary" style="display:none">Turn on mic</button>
        <button id="hand-btn" class="secondary" style="display:none">Raise hand</button>
        <button id="leave-room" class="secondary" style="display:none">Leave room</button>
      </div>
      <p class="msg" id="room-msg"></p>

      <div id="hands-panel" style="display:none">
        <h3>Hands raised</h3>
        <div id="hands"></div>
      </div>

      <h3>In the room</h3>
      <div id="participants"></div>

      <h3>Start a thread</h3>
      <form id="thread-form">
        <input id="thread-title" placeholder="Title (at least 5 characters)" required minlength="5">
        <textarea id="thread-body" placeholder="Write your question or argument..." required rows="4"></textarea>
        <button type="submit">Post thread</button>
      </form>
      <p class="note" id="thread-note" style="display:none">Programs and articles are posted by the club's leaders. You can read them and join the replies.</p>
      <p class="msg" id="thread-msg"></p>

      <h3>Threads</h3>
      <div id="threads"></div>
    </div>

    <!-- Screen 3: one thread with replies -->
    <div id="thread-view" style="display:none">
      <button class="back" id="back-threads">← Back to threads</button>
      <div id="thread-detail"></div>

      <h3>Replies</h3>
      <div id="replies"></div>
      <form id="reply-form">
        <textarea id="reply-body" placeholder="Write a reply..." required rows="3"></textarea>
        <button type="submit">Post reply</button>
      </form>
      <p class="msg" id="reply-msg"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://updxillknwufqekfzkur.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ctcI-xHdTj4TDIS9wC8n-Q_waZAg4F5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const LEADER_ROLES = ['admin', 'moderator', 'scholar'];
    const LEADER_ONLY_SLUGS = ['hub-of-idea'];
    const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

    let currentUser = null;
    let currentRole = 'student';
    let currentCategory = null;
    let currentThread = null;

    // Audio room state
    let channel = null;
    let inRoom = false;
    const peers = new Map();      // userId -> RTCPeerConnection
    const audioEls = new Map();   // userId -> <audio> element
    let micStream = null;
    let micTrack = null;
    let canSpeak = false;         // true after a host invites this user
    let muted = false;
    let handUp = false;

    const $ = id => document.getElementById(id);
    const status = $('status');

    function isHost() { return LEADER_ROLES.includes(currentRole); }
    function myName() { return (currentUser && currentUser.user_metadata && currentUser.user_metadata.full_name) || 'Student'; }

    function showScreen(id) {
      ['list-view', 'category-view', 'thread-view'].forEach(v => {
        $(v).style.display = v === id ? 'block' : 'none';
      });
    }

    function makeCard(title, meta, onClick) {
      const div = document.createElement('div');
      div.className = 'card';
      const strong = document.createElement('strong');
      strong.textContent = title;
      const small = document.createElement('small');
      small.textContent = meta;
      div.append(strong, document.createElement('br'), small);
      if (onClick) div.onclick = onClick;
      return div;
    }

    function makePost(text, meta) {
      const div = document.createElement('div');
      div.className = 'post';
      div.textContent = text;
      const small = document.createElement('div');
      small.className = 'meta';
      small.textContent = meta;
      div.appendChild(small);
      return div;
    }

    function authorName(row) {
      return (row.profiles && row.profiles.full_name) || 'Student';
    }

    function canPostIn(category) {
      if (!category) return false;
      if (!LEADER_ONLY_SLUGS.includes(category.slug)) return true;
      return LEADER_ROLES.includes(currentRole);
    }

    async function showForum(user) {
      currentUser = user;
      $('auth-section').style.display = 'none';
      $('forum-section').style.display = 'block';
      status.textContent = 'Signed in as ' + user.email;

      const { data } = await db.from('profiles').select('role').eq('id', user.id).single();
      currentRole = data ? data.role : 'student';

      showScreen('list-view');
      loadCategories();
    }

    function showAuth() {
      leaveRoom(true);
      currentUser = null;
      currentRole = 'student';
      $('auth-section').style.display = 'block';
      $('forum-section').style.display = 'none';
      status.textContent = 'Welcome. Sign up or log in to join the discussion.';
    }

    async function loadCategories() {
      const box = $('categories');
      const { data, error } = await db.from('categories').select('*').order('id');
      if (error) { box.textContent = 'Could not load categories: ' + error.message; return; }
      box.innerHTML = '';
      data.forEach(c => box.appendChild(makeCard(c.name, c.description || '', () => openCategory(c))));
    }

    function openCategory(c) {
      if (inRoom && currentCategory && currentCategory.slug !== c.slug) leaveRoom(true);
      currentCategory = c;
      $('cat-title').textContent = c.name;
      $('cat-desc').textContent = c.description || '';
      $('thread-msg').textContent = '';

      const allowed = canPostIn(c);
      $('thread-form').style.display = allowed ? '' : 'none';
      $('thread-note').style.display = allowed ? 'none' : 'block';

      showScreen('category-view');
      setRoomMsg('');
      updateRoomUI();
      renderParticipants();
      loadThreads();
    }

    async function loadThreads() {
      const box = $('threads');
      box.textContent = 'Loading...';
      const { data, error } = await db.from('threads')
        .select('id, title, body, created_at, profiles(full_name)')
        .eq('category_id', currentCategory.id)
        .order('created_at', { ascending: false });
      if (error) { box.textContent = 'Could not load threads: ' + error.message; return; }
      box.innerHTML = '';
      if (!data.length) { box.textContent = 'No threads yet.'; return; }
      data.forEach(t => {
        box.appendChild(makeCard(t.title, authorName(t) + ' · ' + new Date(t.created_at).toLocaleDateString(), () => openThread(t)));
      });
    }

    function openThread(t) {
      currentThread = t;
      const detail = $('thread-detail');
      detail.innerHTML = '';
      const title = document.createElement('h2');
      title.textContent = t.title;
      detail.append(title, makePost(t.body, authorName(t) + ' · ' + new Date(t.created_at).toLocaleString()));
      $('reply-msg').textContent = '';
      showScreen('thread-view');
      loadReplies();
    }

    async function loadReplies() {
      const box = $('replies');
      box.textContent = 'Loading...';
      const { data, error } = await db.from('replies')
        .select('id, body, created_at, profiles(full_name)')
        .eq('thread_id', currentThread.id)
        .order('created_at', { ascending: true });
      if (error) { box.textContent = 'Could not load replies: ' + error.message; return; }
      box.innerHTML = '';
      if (!data.length) { box.textContent = 'No replies yet.'; return; }
      data.forEach(r => box.appendChild(makePost(r.body, authorName(r) + ' · ' + new Date(r.created_at).toLocaleString())));
    }

    // ============ AUDIO ROOM ============
    // Each category has its own room. Phones connect directly to each other (peer-to-peer).
    // Supabase Realtime carries the room list (presence) and the connection setup messages.

    function setRoomMsg(text) { $('room-msg').textContent = text; }

    async function joinRoom() {
      if (inRoom || !currentCategory) return;
      setRoomMsg('Connecting...');
      channel = db.channel('psir-room-' + currentCategory.slug, {
        config: { presence: { key: currentUser.id }, broadcast: { self: false } }
      });
      channel.on('presence', { event: 'sync' }, syncPeers);
      channel.on('broadcast', { event: 'signal' }, ({ payload }) => handleSignal(payload));
      channel.on('broadcast', { event: 'control' }, ({ payload }) => handleControl(payload));
      channel.subscribe(async s => {
        if (s === 'SUBSCRIBED') {
          inRoom = true;
          await publish();
          setRoomMsg('You joined. You are listening.');
          updateRoomUI();
        } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') {
          setRoomMsg('Could not connect. Check your internet and try again.');
          leaveRoom(true);
        }
      });
    }

    function leaveRoom(silent) {
      if (!channel) return;
      peers.forEach((pc, id) => dropPeer(id));
      if (micTrack) micTrack.stop();
      micTrack = null;
      micStream = null;
      canSpeak = false;
      muted = false;
      handUp = false;
      inRoom = false;
      const ch = channel;
      channel = null;
      ch.untrack().catch(() => {});
      db.removeChannel(ch);
      if (!silent) setRoomMsg('You left the room.');
      updateRoomUI();
      renderParticipants();
    }

    async function publish() {
      if (!channel) return;
      await channel.track({ name: myName(), role: currentRole, canSpeak, muted, hand: handUp });
      renderParticipants();
    }

    function currentPresence() {
      return channel ? channel.presenceState() : {};
    }

    function roleOf(id) {
      const e = currentPresence()[id];
      return e && e[0] ? e[0].role : null;
    }

    // Connect to everyone else in the room. The person with the smaller id starts each connection.
    function syncPeers() {
      if (!channel) return;
      const st = currentPresence();
      const me = currentUser.id;
      Object.keys(st).forEach(id => {
        if (id === me) return;
        if (!peers.has(id) && me < id) makeOffer(id);
      });
      peers.forEach((pc, id) => { if (!st[id]) dropPeer(id); });
      renderParticipants();
    }

    function makePeer(id) {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      pc.addTransceiver('audio', { direction: 'sendrecv' });
      pc.onicecandidate = e => { if (e.candidate) sendSignal(id, 'ice', e.candidate); };
      pc.ontrack = e => playRemote(id, e.track);
      peers.set(id, pc);
      return pc;
    }

    async function makeOffer(id) {
      const pc = makePeer(id);
      attachMic(pc);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      sendSignal(id, 'offer', pc.localDescription);
    }

    async function handleSignal(msg) {
      if (!channel || msg.to !== currentUser.id) return;
      const from = msg.from;
      if (msg.kind === 'offer') {
        const pc = peers.get(from) || makePeer(from);
        await pc.setRemoteDescription(msg.data);
        attachMic(pc);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal(from, 'answer', pc.localDescription);
      } else if (msg.kind === 'answer') {
        const pc = peers.get(from);
        if (pc) await pc.setRemoteDescription(msg.data).catch(() => {});
      } else if (msg.kind === 'ice') {
        const pc = peers.get(from);
        if (pc && msg.data) pc.addIceCandidate(msg.data).catch(() => {});
      }
    }

    function sendSignal(to, kind, data) {
      if (!channel) return;
      channel.send({ type: 'broadcast', event: 'signal', payload: { to, from: currentUser.id, kind, data } });
    }

    function attachMic(pc) {
      if (!micTrack) return;
      const sender = pc.getSenders()[0];
      if (sender) sender.replaceTrack(micTrack).catch(() => {});
    }

    function playRemote(id, track) {
      let el = audioEls.get(id);
      if (!el) {
        el = document.createElement('audio');
        el.autoplay = true;
        el.playsInline = true;
        document.body.appendChild(el);
        audioEls.set(id, el);
      }
      el.srcObject = new MediaStream([track]);
      el.play().catch(() => {});
    }

    function dropPeer(id) {
      const pc = peers.get(id);
      if (pc) pc.close();
      peers.delete(id);
      const el = audioEls.get(id);
      if (el) { el.srcObject = null; el.remove(); audioEls.delete(id); }
    }

    // Host controls and listener responses
    function handleControl(msg) {
      if (!channel || msg.to !== currentUser.id) return;
      // Only accept control messages from someone with a host role
      if (!LEADER_ROLES.includes(roleOf(msg.from))) return;

      if (msg.action === 'invite') {
        canSpeak = true;
        handUp = false;
        setRoomMsg('A host invited you to speak. Tap "Turn on mic".');
        publish();
      } else if (msg.action === 'revoke') {
        stopMic();
        setRoomMsg('A host asked you to stop speaking.');
      } else if (msg.action === 'remove') {
        setRoomMsg('A host removed you from the room.');
        leaveRoom(true);
      }
      updateRoomUI();
    }

    function hostControl(id, action) {
      if (!isHost() || !channel) return;
      channel.send({ type: 'broadcast', event: 'control', payload: { to: id, from: currentUser.id, action } });
    }

    async function startMic() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true },
          video: false
        });
      } catch (e) {
        setRoomMsg('Microphone blocked. Allow microphone access in your browser settings.');
        return;
      }
      micTrack = micStream.getAudioTracks()[0];
      muted = false;
      canSpeak = true;
      peers.forEach(pc => attachMic(pc));
      await publish();
      setRoomMsg('Your mic is on.');
      updateRoomUI();
    }

    function stopMic() {
      if (micTrack) micTrack.stop();
      micTrack = null;
      micStream = null;
      peers.forEach(pc => {
        const s = pc.getSenders()[0];
        if (s) s.replaceTrack(null).catch(() => {});
      });
      muted = false;
      canSpeak = false;
      publish();
    }

    async function onMicButton() {
      if (!micTrack) {
        await startMic();
      } else {
        muted = !muted;
        micTrack.enabled = !muted;
        setRoomMsg(muted ? 'Muted.' : 'Your mic is on.');
        publish();
      }
      updateRoomUI();
    }

    async function onHandButton() {
      handUp = !handUp;
      await publish();
      setRoomMsg(handUp ? 'Hand raised. A host will see it.' : 'Hand lowered.');
      updateRoomUI();
    }

    function updateRoomUI() {
      $('join-room').style.display = inRoom ? 'none' : 'inline-block';
      $('join-room').disabled = false;
      $('leave-room').style.display = inRoom ? 'inline-block' : 'none';
      $('hand-btn').style.display = inRoom && !isHost() ? 'inline-block' : 'none';
      $('hand-btn').textContent = handUp ? 'Lower hand' : 'Raise hand';
      $('mic-btn').style.display = inRoom && (canSpeak || isHost()) ? 'inline-block' : 'none';
      $('mic-btn').textContent = !micTrack ? 'Turn on mic' : (muted ? 'Unmute' : 'Mute');
      $('hands-panel').style.display = inRoom && isHost() ? 'block' : 'none';
      $('room-desc').textContent = canSpeak
        ? 'You can speak in this room.'
        : 'Join to listen. Speakers are invited by a host.';
    }

    function renderParticipants() {
      const box = $('participants');
      box.innerHTML = '';
      if (!inRoom || !channel) {
        box.textContent = 'Join the room to see who is here.';
        renderHands();
        return;
      }
      const st = currentPresence();
      Object.keys(st).forEach(id => {
        const e = st[id][0];
        const isMe = id === currentUser.id;
        const row = document.createElement('div');
        row.className = 'row';

        const info = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = (e.name || 'Student') + (isMe ? ' (you)' : '');
        info.appendChild(name);

        const tag = document.createElement('span');
        tag.className = 'tag' + (e.canSpeak ? ' speaker' : '');
        tag.textContent = LEADER_ROLES.includes(e.role) ? 'Host' : (e.canSpeak ? 'Speaker' : 'Listener');
        info.appendChild(tag);

        if (e.hand) {
          const hand = document.createElement('span');
          hand.className = 'tag hand';
          hand.textContent = 'hand raised';
          info.appendChild(hand);
        }
        row.appendChild(info);

        if (isHost() && !isMe) {
          const actions = document.createElement('div');
          const speakBtn = document.createElement('button');
          speakBtn.textContent = e.canSpeak ? 'Stop speaking' : 'Invite to speak';
          speakBtn.className = e.canSpeak ? 'secondary' : '';
          speakBtn.onclick = () => hostControl(id, e.canSpeak ? 'revoke' : 'invite');
          const removeBtn = document.createElement('button');
          removeBtn.textContent = 'Remove';
          removeBtn.className = 'danger';
          removeBtn.onclick = () => hostControl(id, 'remove');
          actions.append(speakBtn, removeBtn);
          row.appendChild(actions);
        }
        box.appendChild(row);
      });
      renderHands();
    }

    function renderHands() {
      if (!isHost()) return;
      const box = $('hands');
      box.innerHTML = '';
      const st = currentPresence();
      const raised = Object.keys(st).filter(id => st[id][0].hand && !st[id][0].canSpeak);
      if (!raised.length) {
        box.textContent = 'No hands raised.';
        return;
      }
      raised.forEach(id => {
        const row = document.createElement('div');
        row.className = 'row';
        const label = document.createElement('strong');
        label.textContent = st[id][0].name || 'Student';
        const btn = document.createElement('button');
        btn.textContent = 'Invite to speak';
        btn.onclick = () => hostControl(id, 'invite');
        row.append(label, btn);
        box.appendChild(row);
      });
    }

    // Room buttons
    $('join-room').onclick = joinRoom;
    $('leave-room').onclick = () => leaveRoom(false);
    $('mic-btn').onclick = onMicButton;
    $('hand-btn').onclick = onHandButton;

    // ============ NAVIGATION, THREADS, REPLIES, AUTH ============
    $('back-categories').onclick = () => { leaveRoom(true); showScreen('list-view'); };
    $('back-threads').onclick = () => { showScreen('category-view'); loadThreads(); };

    $('thread-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!canPostIn(currentCategory)) return;
      $('thread-msg').textContent = 'Posting...';
      const { error } = await db.from('threads').insert({
        category_id: currentCategory.id,
        author_id: currentUser.id,
        title: $('thread-title').value.trim(),
        body: $('thread-body').value.trim()
      });
      if (error) { $('thread-msg').textContent = error.message; return; }
      $('thread-msg').textContent = '';
      e.target.reset();
      loadThreads();
    });

    $('reply-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('reply-msg').textContent = 'Posting...';
      const { error } = await db.from('replies').insert({
        thread_id: currentThread.id,
        author_id: currentUser.id,
        body: $('reply-body').value.trim()
      });
      if (error) { $('reply-msg').textContent = error.message; return; }
      $('reply-msg').textContent = '';
      e.target.reset();
      loadReplies();
    });

    $('signup-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('msg').textContent = 'Creating account...';
      const { error } = await db.auth.signUp({
        email: $('signup-email').value,
        password: $('signup-password').value,
        options: { data: { full_name: $('signup-name').value } }
      });
      $('msg').textContent = error ? error.message : 'Account created. Check your email to confirm, then log in.';
    });

    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      $('msg').textContent = 'Logging in...';
      const { data, error } = await db.auth.signInWithPassword({
        email: $('login-email').value,
        password: $('login-password').value
      });
      if (error) { $('msg').textContent = error.message; return; }
      $('msg').textContent = '';
      showForum(data.user);
    });

    $('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      showAuth();
    });

    db.auth.getSession().then(({ data }) => {
      if (data.session) showForum(data.session.user);
      else showAuth();
    });
  </script>
</body>
</html>
