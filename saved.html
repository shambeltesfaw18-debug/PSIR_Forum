<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#102b46">
  <title>Saved papers | PSIR Forum</title>
  <style>
    :root { --navy:#102b46; --blue:#2864a0; --gold:#e7b451; --bg:#f3f6fa; --line:#dfe7ef; --muted:#5b6b7b; --text:#172b3d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--text); background:var(--bg); line-height:1.6; }
    a { color:var(--blue); }
    .top { background:#fff; border-bottom:1px solid var(--line); }
    .top-inner { width:min(900px, calc(100% - 36px)); margin:0 auto; min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
    .brand { font-weight:850; color:var(--navy); text-decoration:none; letter-spacing:.4px; }
    .nav { display:flex; gap:16px; flex-wrap:wrap; font-weight:650; }
    .nav a { color:#45596d; text-decoration:none; }
    .nav a[aria-current="page"] { color:var(--blue); }
    .wrap { width:min(900px, calc(100% - 36px)); margin:0 auto; padding:26px 0 44px; }
    h1 { color:var(--navy); font-size:1.7rem; margin:0 0 6px; }
    .lead { color:var(--muted); margin:0 0 18px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:12px; }
    .card h2 { margin:4px 0 6px; font-size:1.1rem; color:var(--navy); line-height:1.35; }
    .card h2 a { color:inherit; text-decoration:none; }
    .meta { color:var(--muted); font-size:.85rem; }
    .pill { display:inline-block; font-size:.72rem; font-weight:800; padding:3px 9px; border-radius:6px; background:#edf3f9; color:#315b83; margin-bottom:6px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .btn { border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:999px; padding:7px 14px; font:inherit; font-weight:700; cursor:pointer; text-decoration:none; }
    .btn-danger { border-color:#e7c2c7; color:#8c2929; }
    .empty { background:#fff; border:1px dashed #c8d4e0; border-radius:14px; padding:22px; color:var(--muted); }
    .note { background:#fff8e1; border:1px solid #f0e2a6; color:#6b5300; border-radius:12px; padding:12px 14px; font-size:.92rem; margin-bottom:14px; }
    .msg { font-weight:600; min-height:22px; }
    :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  </style>
  <link rel="stylesheet" href="buttons.css">
  <link rel="stylesheet" href="design.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/">PSIR FORUM</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/research.html">Research Hub</a>
        <a href="/news.html">News &amp; Journal</a>
        <a href="/saved.html" aria-current="page">Saved papers</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Saved papers</h1>
    <p class="lead">Approved research, news, and journal items you have saved.</p>
    <p id="msg" class="msg" role="status"></p>
    <div id="content"><p class="meta">Loading…</p></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    "use strict";
    const SUPABASE_URL = "https://updxillknwufqekfzkur.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ctcI-xHdTj4TDIS9wC8n-Q_waZAg4F5";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const content = document.getElementById("content");
    const msg = document.getElementById("msg");
    let me = null;

    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]); }
    function fmt(iso) { return iso ? new Date(iso).toLocaleDateString() : ""; }
    function flash(text, bad) { msg.textContent = text; msg.style.color = bad ? "#8c2929" : "#1b5e20"; }

    async function load() {
      if (!me) {
        content.innerHTML = '<div class="empty">Log in on the <a href="/">home page</a> to see your saved papers.</div>';
        return;
      }
      const { data: marks, error } = await db.from("publication_bookmarks")
        .select("publication_id, created_at").eq("user_id", me.id).order("created_at", { ascending: false }).limit(200);
      if (error) { content.innerHTML = '<div class="note">Could not load your saved papers: ' + esc(error.message) + "</div>"; return; }
      if (!marks.length) { content.innerHTML = '<div class="empty">You have not saved any papers yet. Open a paper and tap <strong>Save</strong>.</div>'; return; }

      const ids = marks.map(m => m.publication_id);
      const { data: pubs, error: pErr } = await db.from("publications")
        .select("id, title, section, publication_type, research_field, decided_at, status, author_id, abstract")
        .in("id", ids);
      if (pErr) { content.innerHTML = '<div class="note">Could not load the papers: ' + esc(pErr.message) + "</div>"; return; }

      const byId = new Map(pubs.map(p => [p.id, p]));
      const shown = marks.map(m => byId.get(m.publication_id)).filter(p => p && p.status === "approved");
      const hidden = marks.length - shown.length;

      const { data: people } = await db.from("profiles").select("id, full_name").in("id", [...new Set(shown.map(p => p.author_id))]);
      const names = new Map((people || []).map(p => [p.id, p.full_name]));

      let html = hidden ? '<div class="note">' + hidden + " saved item" + (hidden > 1 ? "s are" : " is") + " no longer publicly available and are not shown.</div>" : "";
      if (!shown.length) html += '<div class="empty">None of your saved papers are currently available.</div>';
      html += shown.map(p => `
        <article class="card">
          <span class="pill">${esc(p.section === "news" ? "News" : p.section === "journal" ? "Journal" : "Research")} · ${esc(p.publication_type)}</span>
          <h2><a href="/publication.html?id=${esc(p.id)}">${esc(p.title)}</a></h2>
          <div class="meta">${esc(names.get(p.author_id) || "Member")} · ${esc(p.research_field || "")} · ${esc(fmt(p.decided_at))}</div>
          <div class="actions">
            <a class="btn" href="/publication.html?id=${esc(p.id)}">Open</a>
            <button class="btn btn-danger" type="button" data-remove="${esc(p.id)}">Remove</button>
          </div>
        </article>`).join("");
      content.innerHTML = html;
    }

    content.addEventListener("click", async e => {
      const b = e.target.closest("button[data-remove]");
      if (!b || !me) return;
      b.disabled = true;
      const { error } = await db.from("publication_bookmarks").delete()
        .eq("user_id", me.id).eq("publication_id", b.dataset.remove);
      if (error) { flash("Could not remove: " + error.message, true); b.disabled = false; return; }
      flash("Removed from your saved papers.");
      load();
    });

    async function refresh() {
      const { data } = await db.auth.getSession();
      me = data.session ? data.session.user : null;
      load();
    }
    db.auth.onAuthStateChange(() => setTimeout(refresh, 0));
    refresh();
  })();
  </script>
  <script src="appearance.js"></script>
<script src="welcome-tip.js"></script>
</body>
</html>
