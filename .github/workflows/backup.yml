name: Daily database backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Dump the database (public, auth and storage schemas)
        run: |
          docker run --rm -e DB_URL="$SUPABASE_DB_URL" -e PGSSLMODE=require postgres:17 \
            sh -c 'pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --schema=auth --schema=storage' > dump.sql
          test -s dump.sql

      - name: Compress and encrypt
        run: |
          gzip -9 dump.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:BACKUP_ENCRYPTION_KEY \
            -in dump.sql.gz -out backup.sql.gz.enc
          rm -f dump.sql.gz
          test "$(stat -c %s backup.sql.gz.enc)" -gt 1000

      - name: Upload to Google Drive
        run: python3 scripts/backup/drive.py upload backup.sql.gz.enc "daily-$(date -u +%Y-%m-%d).sql.gz.enc"

      - name: Keep the newest 30 daily backups
        run: python3 scripts/backup/drive.py prune 30
