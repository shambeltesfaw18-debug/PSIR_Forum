<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My profile · PSIR Forum</title>
<style>
  :root { --navy:#1b2a41; --gold:#c9a227; --bg:#f7f5f0; --surface:#ffffff; --text:#1b2a41; --muted:#5b6573; --line:#e4e0d6; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  header { background:var(--navy); color:#fff; padding:12px 16px; }
  .bar { max-width:760px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }
  .bar a { color:#fff; text-decoration:none; font-weight:600; }
  .nav { display:flex; flex-wrap:wrap; gap:14px; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 14px; }
  h2 { font-size:18px; margin:26px 0 10px; padding-bottom:4px; border-bottom:2px solid var(--gold); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  label { display:block; font-size:14px; margin:10px 0 4px; }
  input, textarea { width:100%; box-sizing:border-box; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); font-family:inherit; }
  textarea { min-height:90px; }
  button { border:none; cursor:pointer; font-family:inherit; font-size:15px; font-weight:600; padding:10px 18px; border-radius:999px; background:linear-gradient(180deg,#34507a 0%,#1b2a41 60%); color:#fff; margin-top:10px; }
  button.secondary { background:#fff; color:var(--text); border:1px solid var(--line); border-radius:6px; }
  button.link { background:none; color:#1f6f78; padding:4px 0; margin:6px 0 0; border-radius:0; text-decoration:underline; }
  .msg { font-weight:600; min-height:20px; margin:8px 0 0; }
  .ok { color:#2e7d4f; }
  .bad { color:#a3172b; }
  .meta { color:var(--muted); font-size:13px; }
  .item { padding:10px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; }
  [hidden] { display:none !important; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="/">PSIR FORUM</a>
    <nav class="nav">
      <a href="/">Home</a>
      <a href="/discussions">Discussions</a>
      <a href="/categories">Categories</a>
      <a href="/bookmarks">Bookmarks</a>
    </nav>
  </div>
</header>

<main>
  <section id="guest" hidden>
    <h1>Log in</h1>
    <div class="card">
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      <button type="button" class="link" id="showReset">Forgot your password?</button>
      <form id="resetForm" hidden>
        <label for="resetEmail">Your email</label>
        <input id="resetEmail" type="email" autocomplete="email" required>
        <button type="submit">Send reset link</button>
      </form>
      <p class="msg" id="guestMsg"></p>
    </div>
  </section>

  <section id="recovery" hidden>
    <h1>Choose a new password</h1>
    <div class="card">
      <form id="recoveryForm">
        <label for="recoveryPassword">New password (at least 6 characters)</label>
        <input id="recoveryPassword" type="password" autocomplete="new-password" required minlength="6">
        <button type="submit">Save new password</button>
      </form>
      <p class="msg" id="recoveryMsg"></p>
    </div>
  </section>

  <section id="account" hidden>
    <h1>My profile</h1>
    <div class="card">
      <p class="meta">Email: <span id="accountEmail"></span></p>
      <form id="profileForm">
        <label for="fullName">Display name</label>
        <input id="fullName" required minlength="2" maxlength="80">
        <label for="bio">Short bio (up to 300 characters)</label>
        <textarea id="bio" maxlength="300"></textarea>
        <label for="interests">Academic interests (up to 200 characters)</label>
        <input id="interests" maxlength="200" placeholder="e.g. Horn of Africa security, AU institutions">
        <button type="submit">Save profile</button>
      </form>
      <p class="msg" id="profileMsg"></p>
      <p class="meta">Your display name appears on your posts. Your bio and interests are visible to other members.</p>
    </div>

    <div id="academicBox"></div>

    <h2>Change password</h2>
    <div class="card">
      <form id="passwordForm">
        <label for="newPassword">New password (at least 6 characters)</label>
        <input id="newPassword" type="password" autocomplete="new-password" required minlength="6">
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6">
        <button type="submit">Change password</button>
      </form>
      <p class="msg" id="passwordMsg"></p>
    </div>

    <h2>My discussions</h2>
    <div class="card" id="myThreads"><p class="meta">Loading...</p></div>

    <button type="button" class="secondary" id="logoutBtn">Log out</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const SUPABASE_URL = "https://updxillknwufqekfzkur.supabase.co";
  const SUPABASE_KEY = "sb_publishable_ctcI-xHdTj4TDIS9wC8n-Q_waZAg4F5";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = id => document.getElementById(id);
  let user = null;

  function show(which) {
    ["guest", "recovery", "account"].forEach(s => { $(s).hidden = s !== which; });
  }

  function setMsg(el, text, ok) {
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "bad");
  }

  async function loadAccount(u) {
    user = u;
    show("account");
    $("accountEmail").textContent = u.email;
    const { data: p } = await db.from("profiles").select("full_name, bio, interests").eq("id", u.id).maybeSingle();
    $("fullName").value = (p && p.full_name) || (u.user_metadata && u.user_metadata.full_name) || "";
    $("bio").value = (p && p.bio) || "";
    $("interests").value = (p && p.interests) || "";
    loadMyThreads();
  }

  async function loadMyThreads() {
    const box = $("myThreads");
    box.innerHTML = "";
    const [threadsRes, catsRes] = await Promise.all([
      db.from("threads").select("id, title, created_at, category_id").eq("author_id", user.id).order("created_at", { ascending: false }).limit(50),
      db.from("categories").select("id, name")
    ]);
    if (threadsRes.error) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = "Could not load your discussions: " + threadsRes.error.message;
      box.appendChild(p);
      return;
    }
    if (!threadsRes.data.length) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = "You have not posted any discussions yet.";
      box.appendChild(p);
      return;
    }
    const names = new Map((catsRes.data || []).map(c => [c.id, c.name]));
    threadsRes.data.forEach(t => {
      const row = document.createElement("div");
      row.className = "item";
      const title = document.createElement("strong");
      title.textContent = t.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = (names.get(t.category_id) || "Category") + " · " + new Date(t.created_at).toLocaleDateString();
      row.append(title, meta);
      box.appendChild(row);
    });
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    setMsg($("guestMsg"), "Logging in...", true);
    const { error } = await db.auth.signInWithPassword({
      email: $("loginEmail").value.trim(),
      password: $("loginPassword").value
    });
    if (error) setMsg($("guestMsg"), error.message, false);
  });

  $("showReset").addEventListener("click", () => { $("resetForm").hidden = !$("resetForm").hidden; });

  $("resetForm").addEventListener("submit", async e => {
    e.preventDefault();
    setMsg($("guestMsg"), "Sending...", true);
    const redirectTo = new URL("profile.html", location.href).href;
    const { error } = await db.auth.resetPasswordForEmail($("resetEmail").value.trim(), { redirectTo });
    setMsg($("guestMsg"),
      error ? error.message : "If an account exists for that email, a reset link has been sent. Check your inbox.",
      !error);
  });

  $("recoveryForm").addEventListener("submit", async e => {
    e.preventDefault();
    const { error } = await db.auth.updateUser({ password: $("recoveryPassword").value });
    if (error) { setMsg($("recoveryMsg"), error.message, false); return; }
    setMsg($("recoveryMsg"), "Password saved.", true);
    history.replaceState(null, "", location.pathname);
    const { data } = await db.auth.getSession();
    if (data.session) loadAccount(data.session.user);
  });

  $("profileForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("fullName").value.trim();
    const bio = $("bio").value.trim();
    const interests = $("interests").value.trim();
    if (name.length < 2) { setMsg($("profileMsg"), "Display name must be at least 2 characters.", false); return; }

    const { data, error } = await db.from("profiles")
      .update({ full_name: name, bio: bio || null, interests: interests || null })
      .eq("id", user.id)
      .select("id");
    if (error) { setMsg($("profileMsg"), "Could not save: " + error.message, false); return; }
    if (!data || !data.length) { setMsg($("profileMsg"), "Could not save. Please log in again.", false); return; }

    await db.auth.updateUser({ data: { full_name: name } });
    setMsg($("profileMsg"), "Profile saved.", true);
  });

  $("passwordForm").addEventListener("submit", async e => {
    e.preventDefault();
    const a = $("newPassword").value;
    const b = $("confirmPassword").value;
    if (a !== b) { setMsg($("passwordMsg"), "The two passwords do not match.", false); return; }
    const { error } = await db.auth.updateUser({ password: a });
    if (error) { setMsg($("passwordMsg"), error.message, false); return; }
    $("passwordForm").reset();
    setMsg($("passwordMsg"), "Password changed.", true);
  });

  $("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    user = null;
    show("guest");
  });

  db.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") { show("recovery"); return; }
    if (session) loadAccount(session.user);
    else { user = null; show("guest"); }
  });
})();
</script>
<script src="academic.js"></script>
<script src="notifications.js"></script>
<script src="welcome.js"></script>
</body>
</html>
