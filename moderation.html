<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderation · PSIR Forum</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; color: #1b2a41; background: #f7f8fa; line-height: 1.5; }
    h1 { font-size: 24px; }
    button { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: none; background: #1b2a41; color: #fff; cursor: pointer; margin: 4px 4px 4px 0; font-family: inherit; }
    button.secondary { background: #e5e7eb; color: #1b2a41; }
    button.danger { background: #b00020; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 3px solid #c9a227; outline-offset: 2px; }
    .card { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
    .meta { color: #555; font-size: 13px; }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f4f6; padding: 8px; border-radius: 6px; margin: 8px 0; }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #e5e7eb; margin-right: 4px; }
    .tag.hidden { background: #fdecea; color: #611a15; }
    .error-box { background: #fdecea; color: #611a15; padding: 12px; border-radius: 8px; }
    .ok { color: #1b5e20; }
    .bad { color: #b00020; }
    .tabs { margin: 16px 0 8px; }
    h2 { font-size: 18px; }
  </style>
  <link rel="stylesheet" href="buttons.css">
</head>
<body>
  <h1>Moderation</h1>
  <p><a href="index.html">← Back to forum</a></p>
  <p id="status" role="status">Checking your access...</p>
  <p id="msg" role="alert"></p>

  <div id="app" style="display:none">
    <div class="tabs">
      <button id="tab-reports" aria-pressed="true">Open reports</button>
      <button id="tab-log" class="secondary" aria-pressed="false">Audit log</button>
    </div>
    <section id="reports-view"></section>
    <section id="log-view" style="display:none"></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://updxillknwufqekfzkur.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ctcI-xHdTj4TDIS9wC8n-Q_waZAg4F5';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const STAFF = ['admin', 'moderator'];
    const $ = id => document.getElementById(id);

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function btn(label, cls, onClick) {
      const b = el('button', cls, label);
      b.onclick = onClick;
      return b;
    }

    function fmt(iso) {
      return iso ? new Date(iso).toLocaleString() : '';
    }

    function showMsg(text, ok) {
      const m = $('msg');
      m.textContent = text;
      m.className = ok ? 'ok' : 'bad';
    }

    async function init() {
      const { data: s } = await db.auth.getSession();
      if (!s.session) {
        $('status').textContent = 'Please log in on the forum first, then come back to this page.';
        return;
      }
      const { data: p, error } = await db.from('profiles')
        .select('id, full_name, role')
        .eq('id', s.session.user.id)
        .maybeSingle();
      if (error) {
        $('status').textContent = 'Could not check your access: ' + error.message;
        return;
      }
      if (!p || !STAFF.includes(p.role)) {
        $('status').textContent = 'This page is only for moderators and administrators.';
        return;
      }
      $('status').textContent = 'Signed in as ' + p.full_name + ' (' + p.role + ')';
      $('app').style.display = 'block';
      loadReports();
    }

    function showTab(which) {
      const reports = which === 'reports';
      $('reports-view').style.display = reports ? 'block' : 'none';
      $('log-view').style.display = reports ? 'none' : 'block';
      $('tab-reports').setAttribute('aria-pressed', String(reports));
      $('tab-log').setAttribute('aria-pressed', String(!reports));
      $('tab-reports').className = reports ? '' : 'secondary';
      $('tab-log').className = reports ? 'secondary' : '';
      if (reports) loadReports(); else loadLog();
    }

    $('tab-reports').onclick = () => showTab('reports');
    $('tab-log').onclick = () => showTab('log');

    // ============ OPEN REPORTS ============

    async function loadReports() {
      const box = $('reports-view');
      box.innerHTML = '';
      box.appendChild(el('p', 'meta', 'Loading reports...'));
      try {
        const { data: reports, error } = await db.from('reports')
          .select('id, reason, target_type, target_id, created_at, reporter_id, status')
          .eq('status', 'open')
          .order('created_at', { ascending: false })
          .limit(100);
        if (error) throw error;

        box.innerHTML = '';
        if (!reports.length) {
          box.appendChild(el('p', 'meta', 'No open reports.'));
          return;
        }

        const reporterIds = [...new Set(reports.map(r => r.reporter_id))];
        const { data: people } = await db.from('profiles').select('id, full_name').in('id', reporterIds);
        const names = new Map((people || []).map(p => [p.id, p.full_name]));

        const threadIds = reports.filter(r => r.target_type === 'thread').map(r => r.target_id);
        const replyIds = reports.filter(r => r.target_type === 'reply').map(r => r.target_id);
        const content = new Map();
        const pubIds = reports.filter(r => r.target_type === 'publication').map(r => r.target_id);
        const commentIds = reports.filter(r => r.target_type === 'publication_comment').map(r => r.target_id);
        if (pubIds.length) {
          const { data } = await db.from('publications').select('id, title, abstract, status').in('id', pubIds);
          (data || []).forEach(x => content.set('publication:' + x.id, { title: x.title, body: x.abstract, is_hidden: x.status !== 'approved' }));
        }
        if (commentIds.length) {
          const { data } = await db.from('publication_comments').select('id, body, is_hidden').in('id', commentIds);
          (data || []).forEach(x => content.set('publication_comment:' + x.id, x));
        }

        if (threadIds.length) {
          const { data } = await db.from('threads').select('id, title, body, is_hidden').in('id', threadIds);
          (data || []).forEach(t => content.set('thread:' + t.id, t));
        }
        if (replyIds.length) {
          const { data } = await db.from('replies').select('id, body, is_hidden').in('id', replyIds);
          (data || []).forEach(r => content.set('reply:' + r.id, r));
        }

        reports.forEach(r => {
          const item = content.get(r.target_type + ':' + r.target_id);
          box.appendChild(reportCard(r, names.get(r.reporter_id) || 'Member', item));
        });
      } catch (err) {
        box.innerHTML = '';
        box.appendChild(el('p', 'error-box', 'Could not load reports: ' + err.message));
      }
    }

    function reportCard(r, reporterName, item) {
      const card = el('div', 'card');
      card.appendChild(el('div', 'meta', LABELS[r.target_type] || r.target_type));

      if (!item) {
        card.appendChild(el('p', 'meta', 'This content no longer exists. You can dismiss the report.'));
      } else {
        if (item.title) card.appendChild(el('strong', '', item.title));
        card.appendChild(el('div', 'content', item.body));
        card.appendChild(el('span', item.is_hidden ? 'tag hidden' : 'tag', item.is_hidden ? 'Hidden' : 'Visible'));
      }

      card.appendChild(el('p', '', 'Reason: ' + r.reason));
      card.appendChild(el('p', 'meta', 'Reported by ' + reporterName + ' · ' + fmt(r.created_at)));

      const actions = el('div');
      if (item) {
        if (item.is_hidden) {
          actions.appendChild(btn('Restore content', 'secondary', () => moderate(r, false, actions)));
        } else {
          actions.appendChild(btn('Hide content', 'danger', () => moderate(r, true, actions)));
        }
      }
      actions.appendChild(btn('Dismiss report', 'secondary', () => dismissAny(r, actions)));
      card.appendChild(actions);
      return card;
    }

    const LABELS = {
      thread: 'Discussion', reply: 'Reply',
      publication: 'Research or news item', publication_comment: 'Comment on a research or news item'
    };
    const NEW_TYPES = ['publication', 'publication_comment'];

    async function moderateNew(r, hide, actions) {
      if (!hide) { showMsg('Restoring this item is not available yet. It stays hidden.', false); return; }
      const reason = prompt('Reason for hiding this item (at least 5 characters). It will be recorded in the audit log:');
      if (!reason || reason.trim().length < 5) { showMsg('Cancelled. A reason of at least 5 characters is required.', false); return; }
      if (!confirm('Hide this item from members? Only moderators will be able to see it.')) return;
      const buttons = actions.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
      const { error } = await db.rpc('resolve_report', { p_report: r.id, p_decision: 'hide', p_note: reason.trim() });
      if (error) { buttons.forEach(b => b.disabled = false); showMsg('Could not hide the item: ' + error.message, false); return; }
      showMsg('Item hidden and recorded in the audit log.', true);
      loadReports();
    }

    async function dismissAny(r, actions) {
      if (!NEW_TYPES.includes(r.target_type)) return dismiss(r, actions);
      const reason = prompt('Reason for dismissing this report (at least 5 characters):');
      if (!reason || reason.trim().length < 5) { showMsg('Cancelled. A reason of at least 5 characters is required.', false); return; }
      const buttons = actions.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
      const { error } = await db.rpc('resolve_report', { p_report: r.id, p_decision: 'dismiss', p_note: reason.trim() });
      if (error) { buttons.forEach(b => b.disabled = false); showMsg('Could not dismiss the report: ' + error.message, false); return; }
      showMsg('Report dismissed and recorded in the audit log.', true);
      loadReports();
    }

    async function moderate(r, hide, actions) {
      if (NEW_TYPES.includes(r.target_type)) return moderateNew(r, hide, actions);
      const verb = hide ? 'hide' : 'restore';
      const reason = prompt('Reason for you to ' + verb + ' this content (at least 5 characters). It will be recorded in the audit log:');
      if (!reason || reason.trim().length < 5) {
        showMsg('Cancelled. A reason of at least 5 characters is required.', false);
        return;
      }
      if (hide && !confirm('Hide this content from members? Only moderators will be able to see it.')) return;

      const buttons = actions.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
      const { error } = await db.rpc('moderate_content', {
        p_target_type: r.target_type,
        p_target_id: r.target_id,
        p_hide: hide,
        p_reason: reason.trim(),
        p_report_id: r.id
      });
      if (error) {
        buttons.forEach(b => b.disabled = false);
        showMsg('Could not ' + verb + ' content: ' + error.message, false);
        return;
      }
      showMsg('Content ' + (hide ? 'hidden' : 'restored') + ' and recorded in the audit log.', true);
      loadReports();
    }

    async function dismiss(r, actions) {
      const reason = prompt('Reason for dismissing this report (at least 5 characters):');
      if (!reason || reason.trim().length < 5) {
        showMsg('Cancelled. A reason of at least 5 characters is required.', false);
        return;
      }
      const buttons = actions.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
      const { error } = await db.rpc('dismiss_report', { p_report_id: r.id, p_reason: reason.trim() });
      if (error) {
        buttons.forEach(b => b.disabled = false);
        showMsg('Could not dismiss report: ' + error.message, false);
        return;
      }
      showMsg('Report dismissed and recorded in the audit log.', true);
      loadReports();
    }

    // ============ AUDIT LOG ============

    // Hidden items that can be restored (discussions, replies, comments on research and news)
    async function renderHidden(box) {
      const stripTags = s => String(s || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      const [th, rp, pc] = await Promise.all([
        db.from('threads').select('id, title').eq('is_hidden', true).limit(100),
        db.from('replies').select('id, body').eq('is_hidden', true).limit(100),
        db.from('publication_comments').select('id, body').eq('is_hidden', true).limit(100)
      ]);
      const items = [
        ...((th.data || []).map(x => ({ type: 'thread', id: x.id, label: 'Discussion', text: x.title }))),
        ...((rp.data || []).map(x => ({ type: 'reply', id: x.id, label: 'Reply', text: stripTags(x.body) }))),
        ...((pc.data || []).map(x => ({ type: 'publication_comment', id: x.id, label: 'Comment on a research or news item', text: stripTags(x.body) })))
      ];
      const wrap = el('div', 'card');
      wrap.appendChild(el('strong', '', 'Hidden content: restore'));
      if (!items.length) {
        wrap.appendChild(el('p', 'meta', 'Nothing is hidden right now.'));
      }
      items.forEach(it => {
        const row = el('div', '');
        row.appendChild(el('p', 'meta', it.label));
        row.appendChild(el('p', '', String(it.text || '').slice(0, 200)));
        const b = el('button', 'btn btn-line btn-small', 'Restore');
        b.addEventListener('click', async () => {
          const reason = prompt('Reason for restoring this item (at least 5 characters):');
          if (!reason || reason.trim().length < 5) return;
          b.disabled = true;
          const { error } = await db.rpc('restore_content', { p_target_type: it.type, p_target_id: it.id, p_reason: reason.trim() });
          if (error) { b.disabled = false; alert('Could not restore: ' + error.message); return; }
          loadLog();
        });
        row.appendChild(b);
        wrap.appendChild(row);
      });
      box.appendChild(wrap);
    }

    async function loadLog() {
      const box = $('log-view');
      box.innerHTML = '';
      box.appendChild(el('p', 'meta', 'Loading audit log...'));
      try {
        const { data, error } = await db.from('moderation_actions')
          .select('id, actor_name, action, target_type, reason, created_at')
          .order('created_at', { ascending: false })
          .limit(200);
        if (error) throw error;

        box.innerHTML = '';
        await renderHidden(box);
        if (!data.length) {
          box.appendChild(el('p', 'meta', 'No moderation actions yet.'));
          return;
        }
        data.forEach(a => {
          const card = el('div', 'card');
          card.appendChild(el('strong', '', a.action.toUpperCase() + ' · ' + a.target_type));
          card.appendChild(el('p', '', 'Reason: ' + a.reason));
          card.appendChild(el('p', 'meta', 'By ' + a.actor_name + ' · ' + fmt(a.created_at)));
          box.appendChild(card);
        });
      } catch (err) {
        box.innerHTML = '';
        box.appendChild(el('p', 'error-box', 'Could not load audit log: ' + err.message));
      }
    }

    init();
  </script>
</body>
</html>
